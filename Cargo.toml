[workspace]
resolver = "2"
members = [
    "crates/cep",
    "crates/cli-core",
    "crates/git-core",
    "crates/sarment",
    "crates/vignoble",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Julien Muetton <themouette@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/themouette/vignoble"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "suggestions"] }
console = "0.15"
dirs = "6.0"
self_update = { version = "1.3", default-features = false, features = ["github", "compression-tar-gz", "rustls", "progress-bar", "ureq"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
strsim = "0.11"
thiserror = "2.0"
toml = "0.8"

# Dev dependencies
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
